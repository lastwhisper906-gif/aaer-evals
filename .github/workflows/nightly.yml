name: nightly

# The nightly crew's night work: Python only, no model. `src/nightly.py` says
# what it does. Every EDGAR request of this project's nightly crew happens
# here, because the cloud session that writes the morning report may not reach
# sec.gov.
#
# The night publishes itself: `src/nightly.py --publish` commits the run
# directories and the ledger line on `nightly-<date>`, opens the pull request
# into main and turns auto-merge on. Nothing here pushes to main. A pull
# request opened with the Actions token starts no CI, so `GH_TOKEN` is the
# `NIGHTLY_GH_TOKEN` secret (a token of the owner's with `repo` scope) when
# the repository holds one, and the Actions token otherwise -- a pull request
# opened with that one waits with no CI until the morning routine reopens it,
# which starts CI (`docs/routines/morning-report.md` §3).
#
# `TIINGO_TOKEN` is read by the price step out of this step's environment and
# is never printed or written; a night without it records
# `no price series: TIINGO_TOKEN unset` for each run and goes on.

on:
  # 07:00 UTC is 03:00 US Eastern while daylight time is in force and 02:00
  # after it ends; GitHub's schedule has no time zone.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      ticker:
        description: "with accession: extract this filing whether or not it is new"
        required: false
        default: ""
      accession:
        description: "the filing to extract, e.g. 0001628280-26-060361"
        required: false
        default: ""
      since:
        description: "a filing on or after this date is new (default: the last night that ran)"
        required: false
        default: ""
      history_batch:
        description: "past filings to collect tonight, oldest first"
        required: false
        default: "30"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # Action versions are pinned by commit SHA, as in ci.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: install
        run: pip install -r requirements.txt

      # The branch the publish step makes starts from main as checked out; the
      # identity is the one every night's commit carries.
      - name: the night's git identity
        run: |
          git config user.name "aaer-evals nightly"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Whatever the night found, its summary line is published: a night that
      # failed and left nothing is the failure nobody notices. The publish is
      # inside the Python so that it runs after the line is written, whatever
      # the night's exit status.
      - name: detect, extract, check, price, collect, publish
        id: night
        env:
          HAND_TICKER: ${{ inputs.ticker }}
          HAND_ACCESSION: ${{ inputs.accession }}
          SINCE: ${{ inputs.since }}
          HISTORY_BATCH: ${{ inputs.history_batch || '30' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
          GH_TOKEN: ${{ secrets.NIGHTLY_GH_TOKEN || github.token }}
        run: |
          set +e
          # SET or UNSET, never the value.
          if [ -n "$TIINGO_TOKEN" ]; then echo "TIINGO_TOKEN: SET"; else echo "TIINGO_TOKEN: UNSET"; fi
          # An array, so an input holding a space stays one argument.
          args=(--work "$RUNNER_TEMP/nightly" --run-url "$RUN_URL"
                --history-batch "$HISTORY_BATCH" --publish)
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
          if [ -n "$HAND_TICKER" ]; then args+=(--ticker "$HAND_TICKER"); fi
          if [ -n "$HAND_ACCESSION" ]; then args+=(--accession "$HAND_ACCESSION"); fi
          python -m src.nightly "${args[@]}"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: the night's result
        if: always()
        run: exit "${{ steps.night.outputs.code || 1 }}"
