name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Action versions are pinned by commit SHA; tags are mutable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: install
        run: pip install -r requirements.txt

      # The append check needs the baseline branch, which checkout does not
      # fetch on a pull request.
      - name: fetch the baseline branch
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      # runs/, rules/ and events/ are append-only. A failure here means the
      # prediction record is damaged, so it runs before the tests, not after.
      - name: append check
        run: python -m src.append_check --baseline origin/main

      - name: tests
        run: python -m pytest tests -q
