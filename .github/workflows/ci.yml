name: ci

on:
  push:
  pull_request:
    # labeled and unlabeled re-run the evals guard when the owner adds its label
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  # A pull request that touches evals/ needs the owner's label (src/eval_guard.py).
  guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: fetch the baseline branch
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      # The guard that runs is main's copy, never the branch's: a branch cannot
      # rewrite the check that judges it.
      - name: evals guard
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if git cat-file -e origin/main:src/eval_guard.py 2>/dev/null; then
            git show origin/main:src/eval_guard.py > "$RUNNER_TEMP/eval_guard.py"
          else
            cp src/eval_guard.py "$RUNNER_TEMP/eval_guard.py"
          fi
          python "$RUNNER_TEMP/eval_guard.py" --base origin/main --head HEAD --labels "$LABELS" --action "${{ github.event.action }}" --label-added "${{ github.event.label.name }}"

  # The owner's graders over every run, always with main's copy of evals/, run
  # directly rather than through the branch's Makefile, so a branch is graded by the
  # owner's current graders and never by its own.
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      # nothing is installed: the graders and the calculator the hand-worked case
      # runs are standard library only, so no build script of the branch's
      # requirements runs on this job
      - name: fetch the baseline branch
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      # main's evals/ is copied out of the tree and run with -I -S: no site
      # module, so nothing the branch's requirements installed is on the path and
      # no .pth of theirs runs at start; the graders are standard library only and
      # sit after it, the branch's tree after them. The hand-worked DCF case runs
      # the branch's src/calculator.py in a process of its own.
      - name: grade with main's evals/
        run: |
          mkdir -p "$RUNNER_TEMP/graders"
          if git cat-file -e origin/main:evals 2>/dev/null; then
            git archive origin/main evals | tar -x -C "$RUNNER_TEMP/graders"
            echo "graded with evals/ from origin/main"
          else
            cp -r evals "$RUNNER_TEMP/graders/evals"
            echo "origin/main has no evals/ yet: graded with this branch's, the one that creates it"
          fi
          AAER_REPO="$GITHUB_WORKSPACE" python -I -S -c "import sys, runpy; sys.path += ['$RUNNER_TEMP/graders', '$GITHUB_WORKSPACE']; runpy.run_module('evals', run_name='__main__', alter_sys=True)"

  check:
    needs: [guard, eval]
    # Runs whatever happened above, and fails when either did; it is the job main
    # requires, so the guard and the graders block a merge through it.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: the evals guard and the graders passed
        run: |
          echo "guard: ${{ needs.guard.result }}; eval: ${{ needs.eval.result }}"
          test "${{ needs.eval.result }}" = "success"
          # the guard runs on pull requests only; on a push it is skipped, and that is fine
          guard_ok=no
          if [ "${{ needs.guard.result }}" = "success" ]; then guard_ok=yes; fi
          if [ "${{ needs.guard.result }}" = "skipped" ] && [ "${{ github.event_name }}" != "pull_request" ]; then guard_ok=yes; fi
          if [ "$guard_ok" != "yes" ]; then echo "the evals guard did not pass"; exit 1; fi

      # Action versions are pinned by commit SHA; tags are mutable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: install
        run: pip install -r requirements.txt

      # The append check and the plain-name check both read the baseline branch,
      # which checkout does not fetch on a pull request. The ref is named again
      # in the step below rather than left to the Makefile default, so changing
      # that default cannot quietly point CI at a branch nobody fetched.
      - name: fetch the baseline branch
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      # One gate, defined once, in the Makefile: the append check on the
      # record, the plain-name check on the names, then the tests. Naming the
      # steps again here would be the same rule written in two files.
      - name: check
        run: make check PYTHON=python BASELINE=origin/main
